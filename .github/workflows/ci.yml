name: Funnel Labs CI / Quality Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Prettier Code Formatting Check
        run: npm run format:check

  unit-and-integration-tests:
    name: Unit & Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Full Test Suite
        run: npm run test
        env:
          NODE_ENV: test
          VITE_APP_ENV: test
          VITE_SUPABASE_URL: https://mock-ci.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-ci-anon-key

  production-build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-and-integration-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://lxrkseksulgsercthjjp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_6rpCmTuKmE6JNit5LBy4VA_6ZyLxRyf

      - name: Validate Build Output
        run: |
          test -f dist/index.html || exit 1
          echo "Production build succeeded. Output artifact verified."

  e2e-playwright-tests:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [production-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: 'true'
          VITE_APP_ENV: test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
